# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "anima-daemon"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Anima user-session awareness daemon (owns org.moeru.airi.Daemon1 on the session bus)"

[lib]
name = "anima_daemon"
path = "src/lib.rs"

[[bin]]
name = "anima-daemon"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dbus = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
# sha2 0.11's `zeroize` feature propagates through digest 0.11 to
# block-buffer 0.12, whose Drop only scrubs buffered credential bytes when
# that feature is on. Workspace 0.10 has no such scrubbing; keep it untouched.
sha2 = { version = "0.11", features = [ "zeroize" ] }
zeroize = { workspace = true }
anima-a11y = { path = "../anima-a11y" }
anima-acp = { path = "../anima-acp" }
anima-channel = { path = "../anima-channel" }
anima-core = { path = "../anima-core", default-features = false }
anima-llm = { path = "../anima-llm" }
anima-mcp = { path = "../anima-mcp" }
anima-store = { path = "../anima-store" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros","rt-multi-thread","time"] }
futures-util = { workspace = true }
async-trait = { workspace = true }
