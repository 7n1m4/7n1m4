name: anima_control
description: 'Anima control + chat surface — a thin WebSocket client of anima-daemon.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  genui: 0.10.4
  flutter_anima_render:
    path: ../../packages/flutter_anima_render
  intl: ^0.20.2
  # WebSocket transport only. No flutter_rust_bridge / embedded core: mobile is
  # a REMOTE thin client of the daemon (design-flutter-godot-pivot.md, decision B).
  web_socket_channel: ^3.0.0
  file_picker: ^13.4.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  cross_file: 0.3.5+5
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/notices/THIRD_PARTY_NOTICES.md
    - assets/notices/LICENSES/
    - assets/notices/README.md
    - assets/backgrounds/
