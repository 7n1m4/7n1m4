name: 'CI: Godot export/packaging'

# Exports the Godot pet renderer headlessly for Linux desktop on every push
# to verify the export presets and project config remain valid.
#
# Godot headless export requires the official Godot binary + export templates
# for the target platform. This workflow downloads the Godot editor binary
# matching the project's config_version (4.x) and the Linux export template
# TPZ, then runs `godot --headless --export-release "Linux/X11"`.
#
# Reproduce locally:
#   export GODOT_VERSION=4.4.1
#   curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_stable_linux.x86_64.zip
#   unzip godot.zip
#   ./Godot_v${GODOT_VERSION}_stable_linux.x86_64 --headless --export-release "Linux/X11" build/AnimaPet.x86_64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT_EXPORT_PRESET: 'Linux/X11'
  GODOT_EXPORT_DIR: build/godot-linux

jobs:
  export-linux:
    name: Export Godot project (Linux/X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # .NET SDK for the C# Godot project (AnimaPet).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Install Xvfb + libraries needed by the headless Godot editor to
      # initialize a display and parse the project.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libx11-xcb1

      # Download the Godot editor binary matching the project version.
      - name: Download Godot editor
        run: |
          mkdir -p "${RUNNER_TEMP}/godot"
          curl -L -o "${RUNNER_TEMP}/godot/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_stable_linux.x86_64.zip"
          unzip -q "${RUNNER_TEMP}/godot/godot.zip" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot"/Godot_v*.x86_64
          echo "GODOT_BIN=${RUNNER_TEMP}/godot/$(ls ${RUNNER_TEMP}/godot | grep '^Godot_v')" >> "$GITHUB_ENV"

      # Download the Linux export template TPZ so the editor can produce a
      # standalone release executable.
      - name: Download Linux export template
        run: |
          mkdir -p "${RUNNER_TEMP}/templates"
          curl -L -o "${RUNNER_TEMP}/templates/linux_templates.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_stable_export_linux.tpz"
          unzip -q "${RUNNER_TEMP}/templates/linux_templates.zip" -d "${RUNNER_TEMP}/templates"
          # Place templates where the editor expects them.
          mkdir -p ~/.local/share/godot/export_templates/
          cp "${RUNNER_TEMP}/templates/linux_templates.zip" \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.tpz

      # Build the C# project so the export includes compiled assemblies.
      - name: Build C# project
        working-directory: godot
        run: dotnet build AnimaPet.csproj -c Release

      # Headless export for Linux/X11.
      - name: Export Godot project
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          XVFB_PID=$!
          sleep 2
          "${GODOT_BIN}" \
            --headless \
            --path godot \
            --export-release "${GODOT_EXPORT_PRESET}" \
            "${GODOT_EXPORT_DIR}/AnimaPet.x86_64"
          export_status=$?
          kill "${XVFB_PID}" 2>/dev/null || true
          exit "${export_status}"

      - name: Verify export artifact
        run: |
          test -x "${GODOT_EXPORT_DIR}/AnimaPet.x86_64"
          file "${GODOT_EXPORT_DIR}/AnimaPet.x86_64"

      - name: Upload exported binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-x11
          path: |
            ${{ env.GODOT_EXPORT_DIR }}/*
          retention-days: 14
