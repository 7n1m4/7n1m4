name: 'Release: Flutter Mobile'
permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build only (no upload)
        required: false
        default: false
        type: boolean
      artifacts_only:
        description: Build and upload artifacts only (no GitHub release)
        required: false
        default: false
        type: boolean
      tag:
        description: Release tag for GitHub-release upload (defaults to v<package version>)
        required: false
        type: string
  release:
    types:
      - prereleased

jobs:
  android:
    name: Android (AAB + signed APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
      - name: Build AAB
        working-directory: apps/flutter
        run: flutter build appbundle --release
      - name: Build APK (sideload)
        working-directory: apps/flutter
        run: flutter build apk --release
      - name: Clean keystore
        if: always()
        run: rm -f /tmp/release.keystore
      - name: Upload artifacts
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@v7
        with:
          name: airi-flutter-android
          path: |
            apps/flutter/build/app/outputs/bundle/release/*.aab
            apps/flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: iOS (IPA, TestFlight)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
      - name: Install certificate & profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Build IPA
        working-directory: apps/flutter
        run: flutter build ipa --release
      - name: Clean signing material
        if: always()
        run: |
          rm -f /tmp/cert.p12
          security delete-keychain build.keychain || true
      - name: Upload IPA artifact
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@v7
        with:
          name: airi-flutter-ios
          path: apps/flutter/build/ios/ipa/*.ipa
          if-no-files-found: error
